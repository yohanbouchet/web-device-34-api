# =============================================================================
# Fichier     : charts/workshop-api-chart/templates/service-app.yaml
# Rôle        : Service de l'API (repris de k8s/service-app.yaml)
# Utilise     : values.yaml (.Values.app.port)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app-service
spec:
  # Doit correspondre aux labels du Pod de l'API
  selector:
    app: {{ .Release.Name }}-app
  ports:
    - protocol: TCP
      port: {{ .Values.app.port }}
      targetPort: {{ .Values.app.port }}
  type: LoadBalancer
