# =============================================================================
# Fichier     : charts/workshop-api-chart/templates/service-db.yaml
# Rôle        : Service « headless » de la base : son NOM sert d'adresse DNS
#               à l'API (repris de k8s/service-db.yaml)
# Utilise     : values.yaml (.Values.db.port)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-db-service
spec:
  # Doit correspondre aux labels du Pod de la base
  selector:
    app: {{ .Release.Name }}-db
  ports:
    - protocol: TCP
      port: {{ .Values.db.port }}
      targetPort: {{ .Values.db.port }}
  # Pas d'IP virtuelle : le nom DNS mène directement au Pod de la base
  clusterIP: None
