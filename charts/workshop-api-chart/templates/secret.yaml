# =============================================================================
# Fichier     : charts/workshop-api-chart/templates/secret.yaml
# Rôle        : Secret de la base (identifiants), un par release : chaque
#               environnement a ses propres identifiants
# Utilise     : values.yaml (.Values.db.username, .Values.db.password)
# Utilisé par : templates/deployment-db.yaml et templates/deployment-app.yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secret
type: Opaque
# stringData : valeurs en clair DANS le template, Kubernetes les encode
# lui-même en base64 ; "required" refuse l'installation sans mot de passe
stringData:
  username: {{ .Values.db.username | quote }}
  password: {{ required "db.password is required (use --set db.password=...)" .Values.db.password | quote }}
