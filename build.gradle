plugins {
	id 'org.openapi.generator' version '7.14.0'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'maven-publish'
	id 'war'
}

group = 'fr.oc.devops'
version = '0.4.0'

repositories {
	mavenCentral()
}

sourceSets {
	main {
		java {
			srcDirs 'src/main/java'
			srcDirs 'src/main/java-generated'
		}
	}
}

dependencies {

	implementation 'io.swagger.core.v3:swagger-annotations:2.2.55'

	implementation 'org.modelmapper:modelmapper:3.2.8'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	runtimeOnly 'org.postgresql:postgresql:42.7.14'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Spring Boot 4 : @WebMvcTest est livré dans un module de test séparé
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

}

processResources {
	from("$rootDir/src/main/resources/specs/openapi.yaml") {
		into("static")
	}
}

openApiGenerate {
	generatorName = "spring"
	inputSpec = "$rootDir/src/main/resources/specs/openapi.yaml".toString()
	apiPackage = "fr.oc.devops.backend"
	modelPackage = "fr.oc.devops.backend.models"
	configOptions = [
			dateLibrary: "java8",
			interfaceOnly: "true",
			skipDefaultInterface: "true",
			useSpringBoot3: "true",
			library: 'spring-boot',
			// Aucun champ nullable dans la spécification : pas besoin de la
			// bibliothèque jackson-databind-nullable (écrite pour Jackson 2)
			openApiNullable: 'false',
			sourceFolder: "../../../src/main/java-generated".toString()
	]
}

compileJava.dependsOn tasks.openApiGenerate

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

war {
    enabled = false
}

publishing {
    publications {
		MavenPublication(MavenPublication) {
			artifact bootWar
		}
    }
    repositories {
		maven {
			url "https://gitlab.com/api/v4/projects/$System.env.GITLAB_PROJECT_ID/packages/maven"
			name "GitLab"
			credentials(HttpHeaderCredentials) {
				name = System.getenv("GITLAB_TOKEN_NAME")
				value = System.getenv("GITLAB_TOKEN")
			}
			authentication {
				header(HttpHeaderAuthentication)
			}
		}
    }
}

